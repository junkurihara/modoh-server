[package]
name = "httpsig-proto"
description = "Wire format and protocol definition for HTTP message signature in (Mutualized) Oblivious DNS over HTTPS with Authorization"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
rand = "0.10.4"
# hpke requires at least one AEAD feature; `aes` is the one also enabled by odoh-rs
hpke = { version = "0.15.1", default-features = false, features = [
  "alloc",
  "aes",
  "x25519",
  "nistp",
] }
bytes = "1.12.1"
byteorder = "1.5.0"
p256 = { version = "0.14.0" }
elliptic-curve = { version = "0.14.3", features = ["ecdh"] }
ed25519-compact = { version = "2.6.1" }
digest = "0.11.3"
sha2 = "0.11.1"
hkdf = "0.13.0"
httpsig = "0.0.27"
