[package]
name = "modoh-server-lib"
description = "Relay and target libraly for (Mutualized) Oblivious DNS over HTTPS with Authorization"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["rustls"]
metrics = ["opentelemetry_sdk/metrics", "opentelemetry/metrics"]
evil-trace = [
  "dep:tracing-opentelemetry",
  "opentelemetry_sdk/trace",
  "opentelemetry/trace",
]
native-tls = ["dep:hyper-tls"]
rustls = ["dep:hyper-rustls"]
rustls-webpki-roots = ["rustls", "hyper-rustls/webpki-tokio"]
qrlog = ["crossbeam-channel", "hickory-proto"]

[dependencies]
futures = { version = "0.3.31", default-features = false, features = [
  "std",
  "async-await",
] }
tokio = { version = "1.44.0", features = [
  "net",
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
] }
anyhow = "1.0.97"
tracing = "0.1.41"
thiserror = "2.0.12"
async-trait = "0.1.87"

# http handling for both client and server
url = "2.5.4"
ahash = "0.8.11"
hyper = { version = "1.6.0", default-features = false }
http = "1.3.1"
http-body-util = "0.1.3"
hyper-util = { version = "0.1.10", features = ["full"] }

# http handling for client
hyper-tls = { version = "0.6.0", features = [
  "alpn",
  "vendored",
], optional = true }
hyper-rustls = { version = "0.27.5", default-features = false, features = [
  "native-tokio",
  "ring",
  "http1",
  "http2",
], optional = true }

# modoh target handling
odoh-rs = { git = "https://github.com/junkurihara/odoh-rs", rev = "789848b0e0fe77d409fb08fcbfffc32899a71697" }
rand = "0.9.0"
base64 = "0.22.1"
byteorder = "1.5.0"

# validation of id token
serde = { version = "1.0.219", default-features = false }
auth-validator = { git = "https://github.com/junkurihara/rust-token-server", package = "rust-token-server-validator", branch = "develop", default-features = false, features = [
  "blind-signatures",
] }
serde_json = { version = "1.0.140" }

# access control
ipnet = { version = "2.11.0" }
cedarwood = { version = "0.4.6" }
regex = { version = "1.11.1" }

# metrics
opentelemetry = { version = "0.28.0", optional = true }
opentelemetry_sdk = { version = "0.28.0", features = [
  "rt-tokio",
], optional = true }

# tracing requests traveled among relays and targets
# NOTE: DO NOT USE THIS IN PRODUCTION
tracing-opentelemetry = { version = "0.29.0", optional = true }

# httpsig
httpsig-proto = { path = "../httpsig-wire-proto", default-features = false, package = "httpsig-proto" }
httpsig-registry = { path = "../httpsig-registry", default-features = false, package = "httpsig-registry" }
indexmap = { version = "2.8.0" }
httpsig = { version = "0.0.18" }
httpsig-hyper = { version = "0.0.18" }

# logging
crossbeam-channel = { version = "0.5.14", optional = true }
hickory-proto = { version = "0.25.1", default-features = false, optional = true }
