[package]
name = "httpsig-registry"
description = "Handler for endpoints that serves wire-formatted HTTPSig public keys"
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { version = "1.0.104" }
thiserror = { version = "2.0.21" }
pulldown-cmark = { version = "0.13.6", default-features = false }
http = { version = "1.5.0" }
indexmap = { version = "2.14.2" }
minisign-verify = { version = "0.2.5" }
reqwest = { version = "0.13.5", default-features = false, features = [
  "native-tls",
  "http2",
  "hickory-dns",
] }
futures = { version = "0.3.34", default-features = false, features = [
  "std",
  "async-await",
] }
tokio = { version = "1.54.1", features = [
  "net",
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
] }
